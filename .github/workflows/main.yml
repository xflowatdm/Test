name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Convert neural models (optional)
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.5.1" "numpy<2" coremltools
          python convert_models.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project SmoothFrames.xcodeproj \
            -scheme SmoothFrames \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -15 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SmoothFrames.app Payload/
          zip -qr SmoothFrames.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SmoothFrames-ipa
          path: SmoothFrames.ipa
